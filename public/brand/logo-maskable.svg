<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Chia keo">
  <title>Chia keo</title>
  <defs>
    <linearGradient id="ckm-bg" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="ckm-glow" cx=".28" cy=".2" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ckm-l" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="ckm-r" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffe4e6"/><stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="ckm-sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#4c1d95" flood-opacity=".26"/>
    </filter>
  </defs>

  <!-- Maskable: nen tran vien, khong ve khung bo tron (Android co the crop
       thanh hinh tron), moi chi tiet nam trong vung an toan 80% giua. -->
  <rect width="512" height="512" fill="url(#ckm-bg)"/>
  <rect width="512" height="512" fill="url(#ckm-glow)"/>
  <ellipse cx="176" cy="122" rx="104" ry="54" fill="#fff" opacity=".16"/>


  <!-- Hai nua keo nhin nhau: mot khoan duoc chia cho hai nguoi. Bong do (filter)
       de hai vien noi len khoi nen, kieu sticker. -->
  <g transform="translate(256 256) scale(.70) translate(-256 -256)" filter="url(#ckm-sh)">
    <g transform="rotate(-8 186 202)">
      <path d="M112 176 L52 152 q-13-5-9 9 l17 41 -17 41 q-4 14 9 9 l60-24 z" fill="#fde68a" stroke="#fff" stroke-width="15" stroke-linejoin="round"/>
      <circle cx="186" cy="202" r="80" fill="url(#ckm-l)" stroke="#fff" stroke-width="18"/>
      <ellipse cx="162" cy="193" rx="9" ry="12.5" fill="#78350f"/>
      <ellipse cx="214" cy="193" rx="9" ry="12.5" fill="#78350f"/>
      <circle cx="165.5" cy="187.5" r="3.2" fill="#fff" opacity=".92"/>
      <circle cx="217.5" cy="187.5" r="3.2" fill="#fff" opacity=".92"/>
      <path d="M174 224 q14 16 28 0" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="139" cy="219" rx="14" ry="8.5" fill="#fb7185" opacity=".55"/>
      <ellipse cx="237" cy="219" rx="14" ry="8.5" fill="#fb7185" opacity=".55"/>
    </g>
    <g transform="rotate(9 328 314)">
      <path d="M400 292 L458 270 q13-5 9 9 l-16 40 16 40 q4 14-9 9 l-58-23 z" fill="#fecdd3" stroke="#fff" stroke-width="15" stroke-linejoin="round"/>
      <circle cx="328" cy="314" r="74" fill="url(#ckm-r)" stroke="#fff" stroke-width="18"/>
      <ellipse cx="306" cy="305" rx="8.5" ry="11.5" fill="#7f1d1d"/>
      <ellipse cx="352" cy="305" rx="8.5" ry="11.5" fill="#7f1d1d"/>
      <circle cx="309.5" cy="299.5" r="3" fill="#fff" opacity=".92"/>
      <circle cx="355.5" cy="299.5" r="3" fill="#fff" opacity=".92"/>
      <path d="M317 334 q11 15 22 0" fill="none" stroke="#7f1d1d" stroke-width="8.5" stroke-linecap="round"/>
      <ellipse cx="285" cy="330" rx="13" ry="8" fill="#e11d48" opacity=".4"/>
      <ellipse cx="373" cy="330" rx="13" ry="8" fill="#e11d48" opacity=".4"/>
    </g>
  </g>

  <g fill="#fff">
    <path d="M356 158 l9 23 23 9 -23 9 -9 23 -9-23 -23-9 23-9 z" opacity=".95"/>
    <path d="M158 340 l6 16 16 6 -16 6 -6 16 -6-16 -16-6 16-6 z" opacity=".72"/>
  </g>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm check (tsc -b) -> pnpm test -> pnpm build, roi job rieng `pnpm e2e`
  # (tu build FE, ap migration D1 local, bat wrangler dev roi tat).
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@771838b031babbd932f7b91258999ffc2fae3d51
    with:
      run-test: true
      run-build: true
      run-e2e: true

name = "chiakeo"
main = "worker/src/index.ts"
compatibility_date = "2026-07-03"
# nodejs_compat can vi API dung better-auth + drizzle (can Node built-ins).
compatibility_flags = ["nodejs_compat"]
# Chi phuc vu qua custom domain, khong mo chiakeo.huycode.workers.dev.
workers_dev = false
routes = [{ pattern = "chiakeo.huyab.click", custom_domain = true }]

# Vite build ra ./dist; Worker chi chay cho /api/* (ke ca /api/auth/*), con lai
# tra file tinh. not_found_handling = SPA: URL khong khop file nao tra index.html
# de router client tu xu ly.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Origin FE duoc phep goi API (chi can khi FE khong cung domain voi API).
[vars]
ALLOWED_ORIGINS = ""

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "chiakeo-db"
database_id = "d583fc77-ae15-4dfc-9c23-e36240e437f3"
migrations_dir = "drizzle"

# Goi qua env.MAILER.fetch(), khong qua public internet. Secret MAILER_KEY
# (dat bang `wrangler secret put`) phai khop INTERNAL_API_KEY cua Worker mailer.
[[services]]
binding = "MAILER"
service = "mailer"

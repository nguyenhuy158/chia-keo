<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf5ff" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Tính tiền nhóm</title>
    <script>
      // Ap dung theme truoc khi React mount de tranh nhap nhay (FOUC).
      try {
        var stored = localStorage.getItem("chia-keo-theme") || "system";
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored === "dark" || (stored === "system" && prefersDark);
        if (isDark) {
          document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#0c0a09");
        }
      } catch (e) {}
    </script>
    <script>
      // Chan pinch-zoom + double-tap zoom. iOS Safari bo qua user-scalable=no
      // nen phai tu huy cac gesture o day.
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
        document.addEventListener(name, function (event) { event.preventDefault(); }, { passive: false });
      });
      document.addEventListener(
        "touchmove",
        function (event) {
          // Giu lai swipe 1 ngon (PhotoViewer dung de lat anh), chi chan pinch.
          if (event.touches.length > 1) event.preventDefault();
        },
        { passive: false },
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
